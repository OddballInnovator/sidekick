# Sidekick on App Platform: one service (API + web UI) + managed Postgres.
# Deploy: doctl apps create --spec infra/app.yaml
# Then set the REPLACE_ME secrets in the console (or via doctl apps update).
name: sidekick
region: sfo3
services:
- name: api
  github:
    repo: OddballInnovator/sidekick
    branch: main
    deploy_on_push: true
  build_command: pip install -r backend/requirements.txt
  run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --app-dir backend
  http_port: 8080
  health_check:
    http_path: /api/health
  instance_size_slug: basic-xxs
  envs:
  - key: DO_INFERENCE_URL
    value: https://inference.do-ai.run/v1
  - key: DO_INFERENCE_MODEL
    value: llama-4-maverick
  - key: DO_INFERENCE_ROUTER
    value: REPLACE_ME
  - key: DO_INFERENCE_KEY
    type: SECRET
    value: REPLACE_ME
  - key: DIGITALOCEAN_TOKEN
    type: SECRET
    value: REPLACE_ME
  - key: DATABASE_URL
    value: ${sidekick-pg.DATABASE_URL}
  - key: VALKEY_URL
    value: ${sidekick-cache.DATABASE_URL}
  - key: VAPID_PUBLIC_KEY
    value: BPDbSPkMi693xCgcQInvRKSzAfD4VFK6Bc07NYdZTyqvEt0PHG9Wigbd6Bw9Rp1BLY57TtKJYsy8A_-jvfPE_Wc
  - key: VAPID_PRIVATE_KEY
    type: SECRET
    value: REPLACE_ME_DEPLOY_SET_VIA_API
  - key: DEMO_MODE
    value: "0"
databases:
- name: sidekick-pg
  engine: PG
  version: "16"
  size: db-s-1vcpu-1gb
  production: true
  cluster_name: sidekick-pg
- name: sidekick-cache
  engine: VALKEY
  version: "8"
  size: db-s-1vcpu-1gb
  production: true
  cluster_name: sidekick-cache
